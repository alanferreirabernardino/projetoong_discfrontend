<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ONG - Seja Voluntário</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Ajustes específicos para estilização de campos do formulário */
        fieldset {
            border: 1px solid var(--cor-borda);
            border-radius: var(--raio-borda);
            padding: var(--espaco-md);
            margin-bottom: var(--espaco-md);
            background-color: var(--cor-superficie);
        }
        legend {
            font-weight: bold;
            color: var(--cor-primaria);
            padding: 0 var(--espaco-xs);
        }
        input, select {
            width: 100%;
            padding: var(--espaco-xs) var(--espaco-sm);
            border: 1px solid var(--cor-borda);
            border-radius: var(--raio-borda);
            font-family: var(--fonte-principal);
            font-size: var(--tamanho-corpo);
        }
        button[type="submit"] {
            background-color: var(--cor-destaque);
            color: #ffffff;
            border: none;
            padding: var(--espaco-sm) var(--espaco-md);
            border-radius: var(--raio-borda);
            font-weight: bold;
            cursor: pointer;
        }
        button[type="reset"] {
            background-color: transparent;
            color: var(--cor-texto-secundario);
            border: 1px solid var(--cor-borda);
            padding: var(--espaco-sm) var(--espaco-md);
            border-radius: var(--raio-borda);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho com Flexbox -->
    <header style="background-color: var(--cor-superficie); border-bottom: 1px solid var(--cor-borda);">
        <div class="container header-conteudo">
            <img src="img/logo.png" alt="Logotipo do Projeto ONG com duas mãos entrelaçadas segurando um broto de planta" width="180" height="60">
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" style="color: var(--cor-texto-principal); text-decoration: none;">Início</a></li>
                    <li><a href="projetos.html" style="color: var(--cor-texto-principal); text-decoration: none;">Projetos Sociais</a></li>
                    <li><a href="cadastro.html" style="color: var(--cor-destaque); font-weight: bold; text-decoration: none;">Seja Voluntário</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container" style="padding-top: var(--espaco-lg); padding-bottom: var(--espaco-lg);">
        
        <h1 style="font-size: var(--tamanho-h1); color: var(--cor-primaria); margin-bottom: var(--espaco-md);">
            Cadastro de Voluntários e Apoio
        </h1>

        <form action="#" method="post" class="card-ong">
            
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div class="grid-12">
                    <div class="col-12 col-md-6 form-grupo">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                    </div>

                    <div class="col-12 col-md-6 form-grupo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com">
                    </div>

                    <div class="col-12 col-md-4 form-grupo">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" title="Digite o CPF no formato 000.000.000-00">
                    </div>

                    <div class="col-12 col-md-4 form-grupo">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" placeholder="(11) 98765-4321" title="Digite o telefone no formato (XX) XXXXX-XXXX ou (XX) XXXX-XXXX">
                    </div>

                    <div class="col-12 col-md-4 form-grupo">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" required>
                    </div>
                </div>
            </fieldset>

            <!-- Endereço e Localização -->
            <fieldset>
                <legend>Endereço e Localização</legend>
                <div class="grid-12">
                    <div class="col-12 col-md-4 form-grupo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000" title="Digite o CEP no formato 00000-000">
                    </div>

                    <div class="col-12 col-md-8 form-grupo">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required placeholder="Rua, Av., Número, Bairro">
                    </div>

                    <div class="col-12 col-md-8 form-grupo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                    </div>

                    <div class="col-12 col-md-4 form-grupo">
                        <label for="estado">Estado (UF):</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecione...</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Perfil de Engajamento -->
            <fieldset>
                <legend>Perfil de Engajamento</legend>
                <div class="grid-12">
                    <div class="col-12 col-md-8 form-grupo">
                        <label for="area_interesse">Área de Interesse:</label>
                        <select id="area_interesse" name="area_interesse" required>
                            <option value="">Selecione uma área...</option>
                            <option value="educacao">Apoio Pedagógico e Reforço Escolar</option>
                            <option value="logistica">Organização e Logística de Doações</option>
                            <option value="comunicacao">Comunicação e Redes Sociais</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4 form-grupo">
                        <label for="horas_semanais">Disponibilidade (horas/semana):</label>
                        <input type="number" id="horas_semanais" name="horas_semanais" min="1" max="40" required placeholder="Ex: 4">
                    </div>
                </div>
            </fieldset>

            <!-- Botões -->
            <div style="display: flex; gap: var(--espaco-sm); justify-content: flex-end; margin-top: var(--espaco-sm);">
                <button type="reset">Limpar Formulário</button>
                <button type="submit">Enviar Cadastro</button>
            </div>

        </form>

    </main>

    <!-- Rodapé com Flexbox -->
    <footer style="background-color: var(--cor-texto-principal); color: var(--cor-superficie); margin-top: var(--espaco-xl);">
        <div class="container footer-conteudo">
            <p>&copy; 2026 Projeto ONG. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
